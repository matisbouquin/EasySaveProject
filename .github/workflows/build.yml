name: Build and Quality Check
on: [push, pull_request]

env:
  SOLUTION_PATH: EasySave_Project/EasySave_Project.sln
  FOLDER_TEST_PATH: EasySave_Project/EasySave_Project_Test
  DOTNET_VERSION: '8.0'

jobs:
  sonar:
    name: Sonar Cloud
    runs-on: windows-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Récupération complète pour une analyse plus précise

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Create /tmp directory
        run: mkdir -p /tmp

      - name: Install NUnit Test Adapter
        run: dotnet add ${{ env.FOLDER_TEST_PATH }}/EasySave_Project_Test.csproj package NUnit3TestAdapter --version 4.4.0

      - name: Run Tests with NUnit and Generate XML Report
        run: dotnet test ${{ env.SOLUTION_PATH }}  --no-build --configuration Release --logger "trx;LogFileName=TestResult.trx" --results-directory ./TestResults

      - name: Convert TRX to NUnit XML
        run: dotnet tool install -g trx2xml && trx2xml ./TestResults/TestResult.trx ./TestResults/TestResult.xml

      - name: Publish NUnit XML Test Results
        uses: actions/upload-artifact@v4
        with:
          name: NUnit-XML-Test-Results
          path: ./TestResults/TestResult.xml

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin /k:"matisbouquin_EasySaveProject" /o:"matisbouquin" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.cobertura.reportsPaths="D:/a/EasySaveProject/EasySaveProject/EasySave_Project/EasySave_Project_Test/coverage/coverage.cobertura.xml" /d:sonar.coverage.exclusions="**/*Test*.cs" /d:sonar.cs.vstest.reportsPaths="**/*.trx" /d:sonar.verbose=true /d:sonar.scm.provider=git /d:sonar.scm.forceReloadAll=true /d:sonar.scanner.scanAll=false
          dotnet build ${{ env.SOLUTION_PATH }} --configuration Release
          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"