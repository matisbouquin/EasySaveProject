name: Build and Quality Check
on: [push, pull_request]

env:
  SOLUTION_PATH: EasySave_Project/EasySave_Project.sln
  FOLDER_TEST_PATH: EasySave_Project/EasySave_Project_Test
  DOTNET_VERSION: '8.0'

jobs:
  sonar:
    name: Sonar Cloud
    runs-on: windows-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Récupération complète pour une analyse plus précise

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Create /tmp directory
        run: mkdir -p /tmp

      - name: Run Test Coverage
        run: dotnet test ${{ env.SOLUTION_PATH }} /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:CoverletOutput="${{ github.workspace }}/EasySave_Project/EasySave_Project_Test/coverage/coverage.cobertura.xml"

      - name: Debug - List coverage file
        shell: powershell
        run: |
          Get-ChildItem -Path "EasySave_Project/EasySave_Project_Test/coverage" -Recurse
          if (Test-Path "EasySave_Project/EasySave_Project_Test/coverage/coverage.cobertura.xml") {
              Write-Host "Coverage file exists"
              Get-Content "EasySave_Project/EasySave_Project_Test/coverage/coverage.cobertura.xml" -First 10
          } else {
              Write-Host "Coverage file does not exist"
          }

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin /k:"matisbouquin_EasySaveProject" /o:"matisbouquin" /d:sonar.login="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.cobertura.reportsPaths="${{ github.workspace }}/EasySave_Project/EasySave_Project_Test/coverage/coverage.cobertura.xml"
          dotnet build ${{ env.SOLUTION_PATH }} --configuration Release
          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"